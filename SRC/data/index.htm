<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="pico.green.min.css">
    <script src="ansi_up.js"></script>
    <style>
/* For Debug console*/
.shell-body {
  padding: 10px;
  list-style: none;
  background: #300A24;
  color: #CCCCCC;
  font-family: monospace;
  -webkit-border-radius: 10px;
}

.shell-body li {
  position: relative;
  margin-bottom: 0;
}
    </style>
    <title>velogen</title>
  </head>
  <body>
    <header class="container">
      <nav>
        <ul>
          <li><h2>🚲 velogen 🚲</h2></li>
        </ul>
        <ul>
          <li><button onclick="tab(0)">Log</button></li>
          <li><button onclick="tab(1)">Settings</button></li>
        </ul>
      </nav>
    </header>
    <main class="container">
      <!-- <h2>Runtime log</h2> -->
      <!-- <p>Logging console. See what's happening.</p> -->
      <ul class="shell-body", id="log_output"></ul>
    </main>
    <main class="container">
      <!-- <h2>Settings</h2> -->
      <p>See <a href="https://github.com/michael-betz/velogen/blob/main/README.md#implemented-features" target="_blank">configuration reference</a>.</p>
      <textarea id="textArea" rows=13 style="font-family: monospace;" describedby="tStatus">
      ...
      </textarea>
      <small id="tStatus">Not yet loaded ...</small>
      <div class="grid">
        <button class="secondary" id="bnVerify" onclick="prettyPrint();">Verify</button>
        <button class="secondary" id="bnApply" onclick="writeFile();">Apply</button>
        <button class="secondary" onclick="websocket.send('r'); textArea.value = ''; window.location.reload(false);">Reboot</button>
      </div>
    </main>

    <footer class="container">
      <div class="grid" id="grid_stats" style="font-family: monospace; text-align: center;"></div>
    </footer>

    <script>
var host = "velogen.local";
if (window.location.host != "")
  host = window.location.host;

var wsUri = "ws://" + host + "/ws";
var websocket = new WebSocket(wsUri);
websocket.binaryType = 'arraybuffer';

var intervalId, log_leftover, ts_msg;

// --------------------------------
//  Websocket stuff
// --------------------------------
websocket.onclose = function(evt) {
  clearInterval(intervalId);
  intervalId = null;

  set_status_bar("❌ disconnected");

  writeToConsole("WS DISCONNECTED");
};

websocket.onerror = function(evt) {
  set_status_bar(`🔥 ${evt.data}`);
  writeToConsole('ERROR: ' + evt.data);
};

websocket.onopen = function(evt) {
  set_status_bar("⌚ connecting ...");
  writeToConsole("WS CONNECTED");

  // dump complete log buffer
  websocket.send('a1');

  // dump settings.json
  websocket.send('b');

  intervalId = setInterval(function() {
    // get heap command
    websocket.send("h");
    // dump log updates
    websocket.send('a0');
  }, 1000);
};

websocket.onmessage = function(evt) {
  ts_msg = Date.now();
  dat = evt.data;

  // console.log("dat: " + dat);

  if(typeof(dat) != "string") {
    dec = new TextDecoder("utf-8");
    dat = dec.decode(dat);
  }

  if (dat[0] == 'a') {
    let temp_str = log_leftover;
    temp_str += dat.substr(1).replace(/\0/g, '').replace("\r","");
    temp_lines = temp_str.split("\n");
    log_leftover = temp_lines.pop();
    temp_lines.forEach(writeToConsole);
  } else if (dat[0] == 'h') {
    // h,79048,65536,45592,110788,65536,77332,117,-65,2743
    tmp = dat.split(",").slice(1).map(val => parseInt(val))
    rssi = tmp[7];
    cpu_load = tmp[8];
    free_kB = Math.floor(tmp[0] / 1024);
    free_min_kB = Math.floor(tmp[2] / 1024);
    n_underflows = tmp[9];

    set_status_bar(`📡 ${rssi} dBm\t💾 ${free_kB} kB (min ${free_min_kB} kB)`);
  } else if (dat[0] == '{') {
    console.log("Got Settings", dat);
    textArea.value = dat;
    prettyPrint();
    if (isWriting)
      tStatus.innerText = "applied!";
  }
};

function set_status_bar(txt) {
  grid_stats.innerHTML = "";

  txt.split("\t").forEach((t) => {
    const div = document.createElement('div');
    div.innerText = t;
    grid_stats.appendChild(div);
  });
}

// --------------------------------
//  For the console tab
// --------------------------------
// Add a line to the console-log window
var ansi_up = new AnsiUp;
var isScroll = true;
function writeToConsole(message) {
  if (message.length <= 0)
    return;
  // console.log('writing: ' + message);
  var pre = document.createElement("li");
  var html = ansi_up.ansi_to_html(message);
  pre.innerHTML = html;
  pre.style.listStyle = "none"
  log_output.appendChild(pre);
  if (isScroll) {
    window.scrollBy(0, 300);
  }
}

window.onscroll = function() {
  var d = document.documentElement;
  isScroll = d.scrollTop + window.innerHeight === d.offsetHeight;
};

// Switch tabs by index
function tab(pageId) {
  console.log("tab() ", pageId);

  // Let's hope the order holds up
  all_buttons = document.querySelectorAll("button");
  document.querySelectorAll("main").forEach((m, i) => {
    m.style.display = (i == pageId) ? "block" : "none";
    all_buttons[i].classList.add("outline");
  });
  all_buttons[pageId].classList.remove("outline");
  if (pageId != 1)
    isScroll = false;
}

// --------------------------------
//  For the settings tab
// --------------------------------
// Contains the parsed json settings
var json_settings = {};

bnApply.disabled = true;
textArea.onkeyup = e => {
  bnApply.disabled = true;
  textArea.removeAttribute("aria-invalid");
  tStatus.innerText = "not verified";
};
var isWriting = false;

// enable TAB input in textArea
textArea.onkeydown = function(e) {
  if (e.keyCode == 9 || e.which == 9) {
      e.preventDefault();
      var s = this.selectionStart;
      this.value = this.value.substring(0, this.selectionStart) + "    " + this.value.substring(this.selectionEnd);
      this.selectionEnd = s + 4;
  }
}

function writeFile() {
  bnApply.disabled = true;
  var tmp = "b" + textArea.value;
  console.log("Sending", tmp);
  websocket.send(tmp);
  isWriting = true;
  textArea.value = "";
  tStatus.innerText = "applying ...";
}

function prettyPrint() {
    try {
      json_settings = JSON.parse(textArea.value)
      textArea.value = JSON.stringify(json_settings, undefined, 4);
      bnApply.disabled = false;
      textArea.setAttribute("aria-invalid", "false")
      tStatus.innerText = "ready to apply";
    } catch(e) {
      bnApply.disabled = true;
      textArea.setAttribute("aria-invalid", "true")
      var arr = e.message.match(/\d+/g);
      var row = parseInt(arr[0]);
      var col = parseInt(arr[1]);
      console.log('.json error at row / col: ', row, col);

      arr = textArea.value.split('\n');
      var startChar = 0;
      for (var i=0; i < row - 1; i++)
        startChar += arr[i].length + 1;
      startChar += col;

      textArea.focus();
      textArea.selectionStart = startChar;
      textArea.selectionEnd = startChar;
      tStatus.innerText = e.message;
    }
}

// --------------------------------
//  Init
// --------------------------------
tab(0);
    </script>
  </body>
</html>
